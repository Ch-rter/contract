name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (honors rust-toolchain.toml) + wasm target
        run: |
          rustup show
          rustup target add wasm32v1-none

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Stellar CLI
        run: |
          cargo binstall -y stellar-cli@26.1.0
          stellar --version

      # Build wasm first: the factory contractimport!s the treasury wasm at
      # compile time, so the treasury wasm must exist before `cargo test`.
      - name: Build contracts (wasm)
        run: stellar contract build

      - name: Run tests
        run: cargo test --workspace
