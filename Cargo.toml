[workspace]
resolver = "2"
members = [
    "contracts/treasury",
    "contracts/factory",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Charter"]

[workspace.dependencies]
soroban-sdk = { version = "=26.0.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
