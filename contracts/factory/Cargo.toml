[package]
name = "charter-factory"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
charter-treasury = { path = "../treasury" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
charter-treasury = { path = "../treasury", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils", "charter-treasury/testutils"]
